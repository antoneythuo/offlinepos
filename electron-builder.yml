appId: com.offlinepos.app
productName: Offline POS System
copyright: Copyright © 2024

directories:
  buildResources: build
  output: dist

files:
  - dist-electron/**
  - dist/**

# Windows target
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# macOS target
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.business

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Linux target
linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icon.png
  category: Office

# Extra resources bundled with the app
extraResources:
  - from: resources/
    to: resources/
    filter:
      - "**/*"

# Electron version to use
electronVersion: "28.2.8"

# Publish configuration (disabled for offline-first)
publish: null
