appId: com.offlinepos.app
productName: Offline POS System
copyright: Copyright © 2024

directories:
  buildResources: build
  output: dist-build

# Disable asar — keeps files unpacked so relative paths resolve correctly
asar: false

files:
  - dist-electron/**
  - dist-renderer/**

extraResources:
  - from: src/db/migrations
    to: migrations
  - from: src/db/seeds
    to: seeds

# Windows target
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

electronVersion: "28.2.8"
publish: null
